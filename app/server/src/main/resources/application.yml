server:
  port: ${SERVER_PORT:8080}

app:
  version: 0.1.0
  auth:
    issuer: ${AUTH_ISSUER:http://localhost:8081}

spring:
  datasource:
    url: "jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:13306}/${MYSQL_DATABASE:agent_platform}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
    username: ${MYSQL_USER:app}
    password: ${MYSQL_PASSWORD:apppass}
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:16379}
  security:
    oauth2:
      client:
        registration:
          workbench:
            provider: platform-auth
            client-id: ${AUTH_CLIENT_ID:workbench}
            client-secret: ${AUTH_CLIENT_SECRET:workbench-secret}
            authorization-grant-type: authorization_code
            scope: openid,profile
            redirect-uri: "{baseUrl}/login/oauth2/code/workbench"
        provider:
          platform-auth:
            # 显式列 URI 而不是 issuer-uri：后者会在启动时做 discovery，
            # 让 server 的启动依赖 auth 已就绪，本地调试与测试都不方便。
            authorization-uri: ${app.auth.issuer}/oauth2/authorize
            token-uri: ${app.auth.issuer}/oauth2/token
            jwk-set-uri: ${app.auth.issuer}/oauth2/jwks
            user-info-uri: ${app.auth.issuer}/userinfo
            user-name-attribute: sub

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    io.agentscope.platform: DEBUG
