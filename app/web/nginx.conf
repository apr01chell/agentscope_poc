server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 工作台与后端同源：前端只写相对路径，浏览器看到的永远是这一个 origin，
    # session cookie 与 OAuth 跳转都不必处理跨域。
    location /api/ {
        proxy_pass http://server:8080;
        proxy_http_version 1.1;
        # $http_host 而不是 $host：后者会丢掉端口，后端据此推导的 redirect_uri 会变成 :80
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE 长连接必须关掉缓冲，否则事件会被 nginx 攒着不发
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # OAuth2 登录入口与回调：由后端处理（注意 /login 本身是 SPA 路由，不能整段代理）
    location /oauth2/ {
        proxy_pass http://server:8080;
        # $http_host 而不是 $host：后者会丢掉端口，后端据此推导的 redirect_uri 会变成 :80
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /login/oauth2/ {
        proxy_pass http://server:8080;
        # $http_host 而不是 $host：后者会丢掉端口，后端据此推导的 redirect_uri 会变成 :80
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /logout {
        proxy_pass http://server:8080;
        # $http_host 而不是 $host：后者会丢掉端口，后端据此推导的 redirect_uri 会变成 :80
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 单页应用：未知路径回落到 index.html，否则刷新 /workbench 会 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
