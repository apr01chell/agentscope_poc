name: agent-platform

# 默认只起中间件：mysql / redis / rustfs —— 给 IDEA 与 vite 让路。
#
#   docker compose up -d                     # 三个中间件
#   docker compose --profile full up -d      # 再加 server / auth / web（验证用）
#
# 应用服务放在 full profile 里，且宿主端口是 18080/18081/18088：
# 这样即使 full profile 正在跑，本地 IDEA（8080/8081）与 vite（5173/5174）也不冲突。

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-agent_platform}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-apppass}
    ports:
      - "${MYSQL_PORT:-13306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-rootpass}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-16379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # RustFS 以 UID 10001 运行，命名卷默认属主是 root，必须先改属主，否则启动即 permission denied。
  rustfs-perms:
    image: alpine:3.20
    user: root
    volumes:
      - rustfs-data:/data
    command: ["sh", "-c", "chown -R 10001:10001 /data"]
    restart: "no"

  rustfs:
    image: rustfs/rustfs:latest
    depends_on:
      rustfs-perms:
        condition: service_completed_successfully
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      RUSTFS_CONSOLE_ENABLE: "true"
    command: ["--address", ":9000", "--console-enable", "/data"]
    ports:
      - "${RUSTFS_PORT:-9000}:9000"
      - "${RUSTFS_CONSOLE_PORT:-9001}:9001"
    volumes:
      - rustfs-data:/data
    healthcheck:
      # RustFS 自带 /health，返回 200；镜像基于 Alpine（没有 bash），但有 curl。
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  server:
    profiles: ["full"]
    build:
      context: ../app
      dockerfile: server/Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    environment:
      SERVER_PORT: "8080"
      # 浏览器可达 vs 容器内回源，见 application.yml 的注释
      AUTH_PUBLIC_ISSUER: http://localhost:18081
      AUTH_INTERNAL_ISSUER: http://auth:8081
      APP_WEB_ORIGIN: http://localhost:18088
      # 模型：默认接 DeepSeek（OpenAI 兼容）。密钥从 deploy/.env 注入，不写进仓库。
      MODEL_PROVIDER: ${MODEL_PROVIDER:-deepseek}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      MODEL_NAME: ${MODEL_NAME:-deepseek-chat}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-https://api.deepseek.com}
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-agent_platform}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-apppass}
    ports:
      - "${SERVER_PORT:-18080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  auth:
    profiles: ["full"]
    build:
      context: ../app
      dockerfile: auth/Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      AUTH_PORT: "8081"
      # 容器内走服务名与内部端口；宿主端口 13306 只给本机工具用。
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-agent_platform}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-apppass}
    ports:
      - "${AUTH_PORT:-18081}:8081"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/api/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  web:
    profiles: ["full"]
    build:
      context: ../app/web
      dockerfile: Dockerfile
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-18088}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql-data:
  redis-data:
  rustfs-data:
