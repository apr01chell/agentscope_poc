name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端（编译 + 单测）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: mvn verify
        run: mvn -B -f app/pom.xml verify

  frontend:
    name: 前端（lint + 类型 + 单测）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          # 版本取自 package.json 的 packageManager，避免 CI 与本地不一致。
          # 注意：这个路径相对仓库根解析，不受 defaults.run.working-directory 影响。
          package_json_file: app/web/package.json
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: app/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  secrets:
    name: 密钥泄露检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 扫描已跟踪文件里的疑似真实密钥
        run: |
          set -uo pipefail
          # 只扫 git 跟踪的文件，跳过依赖与构建产物。
          # 模式要求"真实密钥长度"（20+ 位），所以文档里的 sk-... / sk-xxx 不会误报；
          # 仓库里有意提交的 dev RSA 私钥不会命中这两个模式。
          if git ls-files -z \
            | xargs -0 grep -nEI '(sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16})' > /tmp/leaks.txt 2>/dev/null; then
            echo "::error::检测到疑似真实密钥，请改用环境变量或未跟踪的 .env："
            cat /tmp/leaks.txt
            exit 1
          fi
          echo "未发现疑似密钥"

  console:
    name: 控制台（类型 + 单测）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/auth-console
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/auth-console/package.json
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: app/auth-console/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
